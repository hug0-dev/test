security:
    # Configuration des hashers de mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Fournisseurs d'utilisateurs
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Configuration des firewalls
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
            
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # Hiérarchie des rôles
    role_hierarchy:
        ROLE_ADMIN: [ROLE_OUVRIER, ROLE_USER]
        ROLE_OUVRIER: [ROLE_USER]

    # Contrôle d'accès
    access_control:
        # Pages publiques
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        
        # Pages nécessitant une authentification
        - { path: ^/user, roles: ROLE_OUVRIER }
        - { path: ^/chantier, roles: ROLE_OUVRIER }
        - { path: ^/equipe, roles: ROLE_OUVRIER }
        - { path: ^/affectation, roles: ROLE_OUVRIER }
        
        # Administration (création/modification/suppression)
        - { path: ^/admin, roles: ROLE_ADMIN }
        
        # Toutes les autres pages nécessitent au minimum ROLE_USER
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hasher plus rapide pour les tests
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10